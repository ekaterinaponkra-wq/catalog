<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Каталог квартир</title>
<style>
  :root{
    --bg:#f4f5f7;--card:#fff;--ink:#1c1d21;--muted:#6b6f76;--line:#e3e5e9;
    --accent:#2f6df6;--accent-soft:#eaf1ff;
    --radius:12px;--shadow:0 1px 3px rgba(20,22,28,.06),0 4px 16px rgba(20,22,28,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  .wrap{max-width:1400px;margin:0 auto;padding:14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .subt{font-size:12px;color:var(--muted);margin-top:2px}
  .modeswitch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
  .modeswitch button{border:0;background:none;padding:8px 15px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);font-family:inherit}
  .modeswitch button.active{background:var(--accent);color:#fff}

  .mobfilterbtn{display:none;width:100%;padding:11px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:500;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow)}

  .layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;font-weight:600}
  .fgroup{margin-bottom:18px}
  .fgroup:last-child{margin-bottom:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;user-select:none;transition:.12s;font-family:inherit}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.small{padding:5px 11px;font-size:12px}
  .chip.dim{opacity:.4;cursor:not-allowed}

  .rangevals{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .dual{position:relative;height:32px;margin-top:2px}
  .dual input[type=range]{position:absolute;top:0;left:0;width:100%;-webkit-appearance:none;background:none;pointer-events:none;height:32px;margin:0}
  .dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
  .dual input[type=range]::-moz-range-thumb{pointer-events:all;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer}
  .dualtrack{position:absolute;top:14px;left:0;width:100%;height:4px;background:var(--line);border-radius:2px}
  .dualfill{position:absolute;top:14px;height:4px;background:var(--accent);border-radius:2px}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--muted)}.count b{color:var(--ink)}
  .viewtabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
  .viewtabs button{border:0;background:none;width:36px;height:32px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .viewtabs button.active{background:var(--accent-soft);color:var(--accent)}
  .viewtabs svg{width:16px;height:16px}
  .reset{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-family:inherit;box-shadow:var(--shadow)}
  .reset:hover{color:var(--ink)}

  .grid{display:grid;gap:14px}
  .grid.c2{grid-template-columns:repeat(2,1fr)}
  .grid.c3{grid-template-columns:repeat(3,1fr)}
  .grid.list{grid-template-columns:1fr}

  .apt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.12s}
  .apt:hover{box-shadow:0 2px 6px rgba(20,22,28,.1),0 8px 24px rgba(20,22,28,.06);transform:translateY(-1px)}
  .grid.list .apt{flex-direction:row}
  .aptimg{position:relative;background:#f0f1f4;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .grid.list .aptimg{width:140px;min-width:140px;aspect-ratio:auto}
  .aptimg img{width:100%;height:100%;object-fit:contain}
  .aptimg .noimg{color:#b3b7bd;font-size:12px;text-align:center;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .aptimg .noimg svg{width:32px;height:32px;opacity:.4}
  .aptbody{padding:12px 13px;flex:1;display:flex;flex-direction:column;gap:8px}
  .aptname{font-weight:600;font-size:14px;letter-spacing:-.01em;word-break:break-word}
  .areabox{display:inline-flex;align-items:baseline;gap:5px;background:var(--accent-soft);color:#1a4bb8;border-radius:8px;padding:5px 10px;font-weight:700;font-size:16px;width:fit-content}
  .areabox span{font-size:11px;font-weight:600;opacity:.8}
  .aptmeta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12.5px;color:var(--muted)}
  .aptmeta b{color:var(--ink);font-weight:600}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
  .badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}
  .b-1С{background:#fef1dd;color:#a85a1e}
  .b-1К2С{background:#e3f5ec;color:#1d7d52}
  .b-3С{background:#eaf1ff;color:#2559c8}
  .b-4С{background:#efe8fd;color:#6d3fc4}
  .b-var{background:#f5f0e0;color:#8a6410}
  .b-corr-plus{background:#e3f5ec;color:#1d7d52}
  .b-corr-minus{background:#fbe6e5;color:#bd3b34}
  .b-torc{background:#fef1dd;color:#b9791a}

  .modal{position:fixed;inset:0;background:rgba(15,17,22,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;cursor:zoom-out}
  .modal.open{display:flex}
  .modal .modalbox{max-width:1000px;width:100%;background:#fff;border-radius:12px;padding:22px;position:relative;max-height:92vh;overflow-y:auto}
  .modal .modalclose{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px}
  .modal h2{font-size:18px;font-weight:600;margin-bottom:12px}
  .modal .modalarea{display:inline-block;background:var(--accent-soft);color:#1a4bb8;padding:8px 14px;border-radius:8px;font-size:22px;font-weight:700;margin-bottom:14px}
  .modal .modalarea span{font-size:12px;font-weight:600;opacity:.8;margin-left:4px}
  .modal .modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px}
  .modal .modalgrid dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-top:8px}
  .modal .modalgrid dd{color:var(--ink);font-weight:500}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}

  .altBtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;margin-top:2px;transition:.12s}
  .altBtn:hover{background:var(--accent);color:#fff}
  .altBtn svg{width:12px;height:12px}

  /* Полноэкранный просмотр изображения */
  .lightbox{position:fixed;inset:0;background:rgba(15,17,22,.96);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .lightbox .lbclose{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.35);border:0;color:#fff;cursor:pointer;padding:8px;border-radius:8px;z-index:2}
  .lightbox .lbclose:hover{background:rgba(0,0,0,.55)}
  .lightbox .lbcap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.4);padding:8px 16px;border-radius:8px;font-size:13px}

  /* Метки-бейджи размера */
  .b-XS{background:#e6f0fa;color:#1f5f9e}
  .b-S{background:#e0f2e9;color:#1d7d52}
  .b-M{background:#fef1dd;color:#a85a1e}
  .b-L{background:#f5e4c7;color:#8a5a12}
  .b-top{background:#fef1dd;color:#b9791a;font-weight:700}
  .b-antitop{background:#fbe6e5;color:#bd3b34;font-weight:700}
  .b-exc{background:#f5e6ff;color:#7c2fb3;font-weight:700}

  /* Админ-блок в карточке */
  .adminbox{border-top:1px dashed var(--line);margin-top:2px;padding-top:9px;display:flex;flex-direction:column;gap:9px}
  .adminlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:4px}
  .miniChips{display:flex;flex-wrap:wrap;gap:4px}
  .miniChip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;cursor:pointer;user-select:none;font-family:inherit;color:var(--ink)}
  .miniChip:hover{border-color:var(--accent)}
  .miniChip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .miniChip.on.XS{background:#1f5f9e;border-color:#1f5f9e}
  .miniChip.on.S{background:#1d7d52;border-color:#1d7d52}
  .miniChip.on.M{background:#a85a1e;border-color:#a85a1e}
  .miniChip.on.L{background:#8a5a12;border-color:#8a5a12}
  .miniChip.on.top{background:#b9791a;border-color:#b9791a}
  .miniChip.on.antitop{background:#bd3b34;border-color:#bd3b34}
  .miniChip.on.exc{background:#7c2fb3;border-color:#7c2fb3}
  .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit;resize:vertical;min-height:36px;background:#fcfcfd}
  .note:focus{outline:none;border-color:var(--accent)}


  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    .mobfilterbtn{display:block}
    .panel.filters{display:none}
    .panel.filters.open{display:block}
    .grid.c3{grid-template-columns:repeat(2,1fr)}
    h1{font-size:16px}
    .modal .modalgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="background:var(--accent);padding:8px 16px;border-radius:10px;display:flex;align-items:center;line-height:1">
        <svg width="72" height="20" viewBox="0 0 100 28" xmlns="http://www.w3.org/2000/svg" aria-label="META">
          <text x="50" y="22" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="#fff" text-anchor="middle" letter-spacing="1.5">META</text>
        </svg>
      </div>
      <div>
        <h1>Каталог квартир</h1>
        <div class="subt" id="subt"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="modeswitch" id="modeswitch">
        <button data-m="view" class="active">Просмотр</button>
        <button data-m="admin">Администратор</button>
      </div>
      <div class="viewtabs" id="viewtabs">
        <button data-v="c2" title="Крупная сетка"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg></button>
        <button data-v="c3" class="active" title="Мелкая сетка"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="4" height="4"/><rect x="6" y="1" width="4" height="4"/><rect x="11" y="1" width="4" height="4"/><rect x="1" y="6" width="4" height="4"/><rect x="6" y="6" width="4" height="4"/><rect x="11" y="6" width="4" height="4"/><rect x="1" y="11" width="4" height="4"/><rect x="6" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/></svg></button>
        <button data-v="list" title="Список"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="14" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>
      </div>
    </div>
  </header>

  <button class="mobfilterbtn" onclick="document.querySelector('.panel.filters').classList.toggle('open')">☰ Фильтры</button>

  <div class="layout">
    <aside class="panel filters">
      <div class="fgroup">
        <h3>Типология</h3>
        <div class="chips" id="fType"></div>
      </div>
      <div class="fgroup">
        <h3>Глубина, м</h3>
        <div class="chips" id="fDepth"></div>
      </div>
      <div class="fgroup">
        <h3>Ширина, м</h3>
        <div class="chips" id="fWidth"></div>
      </div>
      <div class="fgroup">
        <h3>Со стороны коридора</h3>
        <div class="chips" id="fCorr"></div>
      </div>
      <div class="fgroup">
        <h3>Торцевое +1.5</h3>
        <div class="chips" id="fEnd"></div>
      </div>
      <div class="fgroup">
        <h3>Вариант</h3>
        <div class="chips" id="fVar"></div>
      </div>
      <div class="fgroup">
        <h3>Площадь, м²</h3>
        <div class="rangevals"><span id="areaMinL">0</span><span id="areaMaxL">100</span></div>
        <div class="dual">
          <div class="dualtrack"></div>
          <div class="dualfill" id="dualfill"></div>
          <input type="range" id="areaMin" min="0" max="100" value="0">
          <input type="range" id="areaMax" min="0" max="100" value="100">
        </div>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="count" id="count"></div>
        <button class="reset" id="reset">Сбросить фильтры</button>
      </div>
      <div class="grid c3" id="grid"></div>
      <div class="empty" id="empty" style="display:none">Ничего не нашли по этому фильтру</div>
    </main>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalbox" onclick="event.stopPropagation()">
    <button class="modalclose" onclick="document.getElementById('modal').classList.remove('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <div id="mImgBox" style="text-align:center;margin-bottom:14px">
      <img id="mImg" src="" alt="" style="max-width:100%;max-height:65vh;object-fit:contain;background:#f8f9fb;border-radius:8px;padding:12px;cursor:zoom-in" onerror="this.style.display='none'" onclick="openLightbox(this.src)">
    </div>
    <h2 id="mName"></h2>
    <div class="modalarea" id="mArea"></div>
    <dl class="modalgrid" id="mGrid"></dl>
  </div>
</div>


<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lbclose" onclick="event.stopPropagation();closeLightbox()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <img id="lbImg" src="" alt="" onclick="event.stopPropagation()">
  <div class="lbcap" id="lbCap"></div>
</div>

function imgPath(n) {
  const clean = n
    .replace(/\s+_/g, '_')
    .replace(/\s+/g, ' ')
    .replace(/\./g, '-')
    .replace(/\//g, '-');
  return 'apt - План этажа - ' + clean + '_Ф2.png';
}


function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lbImg').src = src;
  const name = document.getElementById('mName').textContent;
  document.getElementById('lbCap').textContent = name;
  lb.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('modal').classList.remove('open');
  }
});

const state = { type: null, d: null, w: null, c: null, eb: null, v: null, aMin: 0, aMax: 100, view: 'c3', mode: 'view' };
const STORAGE_KEY = 'apt-catalog-meta-v1';
let META = {};
try { META = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { META = {}; }
function metaFor(n) { if (!META[n]) META[n] = { size: null, flag: null, exc: false, note: '' }; return META[n]; }
function saveMeta() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(META)); } catch(e){} }
const A_MIN = Math.floor(Math.min(...APTS.map(a=>a.a)));
const A_MAX = Math.ceil(Math.max(...APTS.map(a=>a.a)));
state.aMin = A_MIN; state.aMax = A_MAX;

function fmt(x) { return Number(x).toFixed(1).replace(/\.0$/, ''); }
function typeCls(t) { return 'b-' + t.replace('/','').replace('К','К').replace('С','С'); }

function passes(a) {
  if (state.type && a.t !== state.type) return false;
  if (state.d !== null && a.d !== state.d) return false;
  if (state.w !== null && a.w !== state.w) return false;
  if (state.c !== null) { const target = state.c === '±0' ? '' : state.c; if (a.c !== target) return false; }
  if (state.eb !== null && a.eb !== state.eb) return false;
  if (state.v !== null && a.v !== state.v) return false;
  if (a.a < state.aMin || a.a > state.aMax) return false;
  return true;
}

function chipsBlock(id, values, current, formatter, setter) {
  const box = document.getElementById(id);
  if (!values.length) { box.innerHTML = '<div style="color:var(--muted);font-size:12px">—</div>'; return; }
  box.innerHTML = '<div class="chip small ' + (current === null ? 'on' : '') + '" data-val="__all__">Все</div>' +
    values.map(v => '<div class="chip small ' + (String(current) === String(v) ? 'on' : '') + '" data-val="' + v + '">' + (formatter ? formatter(v) : v) + '</div>').join('');
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => setter(c.dataset.val === '__all__' ? null : c.dataset.val));
}

function render() {
  // Типология всегда фиксирована
  const types = ['1С','1К/2С','3С','4С'];
  document.getElementById('fType').innerHTML = 
    '<div class="chip small ' + (state.type === null ? 'on' : '') + '" data-t="__all__">Все</div>' +
    types.map(t => '<div class="chip small ' + (state.type === t ? 'on' : '') + '" data-t="' + t + '">' + t + '</div>').join('');
  document.getElementById('fType').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.type = c.dataset.t === '__all__' ? null : c.dataset.t;
    state.d = state.w = state.c = state.eb = state.v = null;
    render();
  });

  // Наборы значений — из выборки по типу
  const scope = state.type ? APTS.filter(a => a.t === state.type) : APTS;
  const depths = [...new Set(scope.map(a=>a.d))].sort((x,y)=>x-y);
  const widths = [...new Set(scope.map(a=>a.w))].sort((x,y)=>x-y);
  const corrsRaw = [...new Set(scope.map(a=>a.c))];
  const corrs = [];
  if (corrsRaw.includes('')) corrs.push('±0');
  corrsRaw.filter(x => x !== '').sort().forEach(x => corrs.push(x));
  const ends   = [...new Set(scope.map(a=>a.eb))];
  const vars   = [...new Set(scope.map(a=>a.v))].filter(x=>x!=='').sort();

  chipsBlock('fDepth', depths, state.d===null?null:state.d, fmt, v => { state.d = v===null?null:parseFloat(v); render(); });
  chipsBlock('fWidth', widths, state.w===null?null:state.w, fmt, v => { state.w = v===null?null:parseFloat(v); render(); });
  chipsBlock('fCorr', corrs, state.c, null, v => { state.c = v; render(); });
  const endOpts = [];
  if (ends.includes(0)) endOpts.push('±0');
  if (ends.includes(1.5)) endOpts.push('+1.5');
  chipsBlock('fEnd', endOpts, state.eb === 0 ? '±0' : state.eb === 1.5 ? '+1.5' : null, null, v => { state.eb = v === null ? null : (v === '±0' ? 0 : 1.5); render(); });
  chipsBlock('fVar', vars, state.v, v => '_'+v, v => { state.v = v; render(); });

  // Result
  const res = APTS.filter(passes);
  document.getElementById('count').innerHTML = 'Найдено: <b>' + res.length + '</b> из ' + APTS.length;
  document.getElementById('subt').textContent = APTS.length + ' квартир · глубина 3.5–7.7 м · площадь ' + A_MIN + '–' + A_MAX + ' м²';

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.className = 'grid ' + state.view;
  if (res.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = res.map((a,i) => {
      const m = metaFor(a.n);
      const badges = [];
      badges.push('<span class="badge b-' + a.t.replace('/','') + '">' + a.t + '</span>');
      if (a.eb) badges.push('<span class="badge b-torc">+торц. 1.5</span>');
      if (a.v) {
        badges.push('<span class="badge b-var">вариант _' + a.v + '</span>');
        badges.push('<button class="altBtn" data-alt="' + APTS.indexOf(a) + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8h12M10 4l4 4-4 4"/></svg>Другие варианты</button>');
      }
      if (m.size) badges.push('<span class="badge b-' + m.size + '">' + m.size + '</span>');
      if (m.flag === 'top') badges.push('<span class="badge b-top">ТОП</span>');
      if (m.flag === 'antitop') badges.push('<span class="badge b-antitop">Анти-ТОП</span>');
      if (m.exc) badges.push('<span class="badge b-exc">Эксклюзив</span>');

      let admin = '';
      if (state.mode === 'admin') {
        const on = (v, cls) => 'miniChip' + (v ? ' on' + (cls?' '+cls:'') : '');
        admin = '<div class="adminbox">' +
          '<div><div class="adminlabel">Размер</div><div class="miniChips">' +
            ['XS','S','M','L'].map(sz => '<button class="' + on(m.size===sz, sz) + '" data-act="size" data-v="' + sz + '">' + sz + '</button>').join('') +
          '</div></div>' +
          '<div><div class="adminlabel">Флаг</div><div class="miniChips">' +
            '<button class="' + on(m.flag==='top','top') + '" data-act="flag" data-v="top">ТОП</button>' +
            '<button class="' + on(m.flag==='antitop','antitop') + '" data-act="flag" data-v="antitop">Анти-ТОП</button>' +
            '<button class="' + on(m.exc,'exc') + '" data-act="exc" data-v="1">Эксклюзив</button>' +
          '</div></div>' +
          '<div><div class="adminlabel">Комментарий</div>' +
            '<textarea class="note" placeholder="Заметка…" data-act="note">' + escHtml(m.note || '') + '</textarea>' +
          '</div>' +
        '</div>';
      }

      return '<div class="apt" data-idx="' + APTS.indexOf(a) + '">' +
        '<div class="aptimg">' +
          '<img src="' + escHtml(imgPath(a.n)) + '" alt="' + escHtml(a.n) + '" ' +
          'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
          '<div class="noimg" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V12h6v9"/></svg><div>план ' + escHtml(a.n) + '</div></div>' +
        '</div>' +
        '<div class="aptbody">' +
          '<div class="aptname">' + escHtml(a.n) + '</div>' +
          '<div class="areabox">' + fmt(a.a) + '<span>м²</span></div>' +
          '<div class="aptmeta"><span>Глубина <b>' + fmt(a.d) + (a.eb?'+'+fmt(a.eb):'') + '</b></span><span>Ширина <b>' + fmt(a.w) + '</b></span></div>' +
          '<div class="badges">' + badges.join('') + '</div>' +
          admin +
        '</div>' +
      '</div>';
    }).join('');
    // Клик по карточке (не по админ-контролам) — открыть модалку
    grid.querySelectorAll('.apt').forEach(el => {
      el.onclick = (ev) => {
        if (ev.target.closest('.adminbox')) return;
        if (ev.target.closest('.altBtn')) return;
        showModal(APTS[el.dataset.idx]);
      };
    });
    grid.querySelectorAll('.altBtn').forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const a = APTS[btn.dataset.alt];
        // фильтр по габаритам, все варианты
        state.type = a.t;
        state.d = a.d;
        state.w = a.w;
        state.eb = a.eb;
        state.c = a.c;
        state.v = null;
        state.aMin = A_MIN;
        state.aMax = A_MAX;
        aMin.value = A_MIN;
        aMax.value = A_MAX;
        updRange();
        // Прокрутить наверх сетки
        window.scrollTo({top: 0, behavior: 'smooth'});
      };
    });
    // Админ-контролы
    grid.querySelectorAll('.miniChip').forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const card = btn.closest('.apt');
        const a = APTS[card.dataset.idx];
        const m = metaFor(a.n);
        const act = btn.dataset.act, val = btn.dataset.v;
        if (act === 'size') m.size = (m.size === val) ? null : val;
        if (act === 'flag') m.flag = (m.flag === val) ? null : val;
        if (act === 'exc') m.exc = !m.exc;
        saveMeta();
        render();
      };
    });
    grid.querySelectorAll('textarea.note').forEach(ta => {
      ta.onclick = ev => ev.stopPropagation();
      ta.oninput = () => {
        const card = ta.closest('.apt');
        const a = APTS[card.dataset.idx];
        metaFor(a.n).note = ta.value;
        saveMeta();
      };
    });
  }
}

function escHtml(s) { return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showModal(a) {
  const mImg = document.getElementById('mImg'); mImg.style.display=''; mImg.src = imgPath(a.n);
  document.getElementById('mName').textContent = a.n;
  document.getElementById('mArea').innerHTML = fmt(a.a) + '<span>м²</span>';
  const parts = [
    ['Типология', a.t],
    ['Глубина базовая', fmt(a.d) + ' м'],
    ['Торцевое увеличение', a.eb ? '+' + fmt(a.eb) + ' м' : '—'],
    ['Ширина по фасаду', fmt(a.w) + ' м'],
    ['Со стороны коридора', a.c || '—'],
    ['Вариант планировки', a.v ? '_' + a.v : '—'],
  ];
  document.getElementById('mGrid').innerHTML = parts.map(([k,v]) => '<dt>' + k + '</dt><dd>' + escHtml(String(v)) + '</dd>').join('');
  document.getElementById('modal').classList.add('open');
}
document.getElementById('modal').onclick = () => document.getElementById('modal').classList.remove('open');

// Range slider
const aMin = document.getElementById('areaMin');
const aMax = document.getElementById('areaMax');
aMin.min = A_MIN; aMin.max = A_MAX; aMin.value = A_MIN;
aMax.min = A_MIN; aMax.max = A_MAX; aMax.value = A_MAX;
function updRange() {
  let lo = parseFloat(aMin.value), hi = parseFloat(aMax.value);
  if (lo > hi) { [lo, hi] = [hi, lo]; }
  state.aMin = lo; state.aMax = hi;
  document.getElementById('areaMinL').textContent = fmt(lo);
  document.getElementById('areaMaxL').textContent = fmt(hi);
  const span = A_MAX - A_MIN;
  const l = ((lo - A_MIN) / span) * 100;
  const r = ((hi - A_MIN) / span) * 100;
  const fill = document.getElementById('dualfill');
  fill.style.left = l + '%';
  fill.style.width = (r - l) + '%';
  render();
}
aMin.oninput = updRange;
aMax.oninput = updRange;

// Mode switch
document.querySelectorAll('#modeswitch button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#modeswitch button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.mode = b.dataset.m;
  render();
});

// View tabs
document.querySelectorAll('#viewtabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#viewtabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.view = b.dataset.v;
  render();
});

document.getElementById('reset').onclick = () => {
  state.type = state.d = state.w = state.c = state.eb = state.v = null;
  state.aMin = A_MIN; state.aMax = A_MAX;
  aMin.value = A_MIN; aMax.value = A_MAX;
  updRange();
};

updRange();
render();
</script>
</body>
</html>
